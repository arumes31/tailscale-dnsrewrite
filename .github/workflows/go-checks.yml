name: Go Checks

on:
  push:
    branches: [ "main", "v2_test" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'webgui/go.mod'
          cache-dependency-path: 'webgui/go.sum'

      - name: Check version consistency
        shell: bash
        run: |
          app_version="$(tr -d '[:space:]' < webgui/VERSION)"
          docker_version="$(sed -n 's/^ARG VERSION=//p' Dockerfile | head -n 1)"
          if [[ ! "${app_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "webgui/VERSION must contain a stable semantic version (X.Y.Z)" >&2
            exit 1
          fi
          if [[ "${docker_version}" != "${app_version}" ]]; then
            echo "Dockerfile version ${docker_version} does not match application version ${app_version}" >&2
            exit 1
          fi

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
        working-directory: webgui

      - name: Verify module integrity and tidiness
        shell: bash
        run: |
          go mod verify
          go mod tidy -diff
        working-directory: webgui

      - name: Build
        run: go build ./...
        working-directory: webgui

      - name: Test with coverage
        shell: bash
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v total="${total}" 'BEGIN { if (total < 45) { printf "coverage %.1f%% is below 45%%\n", total; exit 1 } }'
        working-directory: webgui

      - name: Run govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0 && govulncheck ./...
        working-directory: webgui

      - name: Run gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0 && gosec ./...
        working-directory: webgui

      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          $(go env GOPATH)/bin/golangci-lint run
        working-directory: webgui

  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run UDP, TCP, DoH, and DoT smoke tests
        run: bash ./contrib/docker-smoke.sh
